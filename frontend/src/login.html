<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf4ff, #f7fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
    }

   .login-container {
  max-width: 450px;
  padding: 40px;
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}


    /* Left Illustration Section */
    .login-illustration {
      background: linear-gradient(135deg, #4da3ff, #1e6fd9);
      color: #fff;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-illustration h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .login-illustration p {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.6;
    }

    /* Login Form Section */
    .login-form {
      padding: 50px 40px;
    }

    .login-form h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #222;
    }

    .login-form p {
      color: #666;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #1e6fd9;
    }

    .forgot-password {
      text-align: right;
      margin-bottom: 25px;
    }

    .forgot-password a {
      font-size: 14px;
      color: #1e6fd9;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #1e6fd9;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-btn:hover {
      background: #155bb5;
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      color: #999;
      font-size: 14px;
    }

    .social-login {
      display: flex;
      gap: 15px;
    }

    .social-login button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-weight: 500;
    }

    .signup-link {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
    }

    .signup-link a {
      color: #1e6fd9;
      text-decoration: none;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-container {
        grid-template-columns: 1fr;
      }

      .login-illustration {
        display: none;
      }
    }
  </style>
</head>
<body>

   

  <div class="login-container">
    
    <!-- Login Form -->
    <div class="login-form">
      <h2>Welcome Back 👋</h2>
      <p>Please login to continue</p>

      <form>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" required>
        </div>

        <div class="forgot-password">
          <a href="#">Forgot password?</a>
        </div>

        <button class="login-btn" type="submit">Sign In</button>

        <div class="signup-link">
          Don’t have an account? <a href="#">Sign Up</a>
        </div>
      </form>
    </div>

  </div>


</body>
</html>
